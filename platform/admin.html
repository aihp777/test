<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | 와이드가드 매칭</title>
<link rel="icon" href="/images/logo-dark.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/platform.css">
</head>
<body>
<main>
  <div class="p-container">
    <div class="page-head"><h1>플랫폼 관리자</h1><p>업체 승인, 거래 현황, 수수료를 관리합니다.</p></div>
    <div class="grid g4 mb" id="stats"></div>
    <div class="tabs" id="tabs">
      <button class="on" data-t="vendors">업체 관리</button>
      <button data-t="requests">견적 요청</button>
      <button data-t="payments">결제 · 정산</button>
      <button data-t="settings">설정</button>
    </div>
    <div id="view"></div>
  </div>
</main>
<script type="module">
import { renderHeader, requireLogin, $, $$, esc, won, date, datetime, badge, toast, store , regionLabel } from "/assets/js/ui.js";
import { REQUEST_STATUS, VENDOR_STATUS } from "/assets/js/config.js";
await renderHeader();
await requireLogin(["admin"]);

async function stats() {
  const [pend, appr, reqs, pays] = await Promise.all([store.listVendors({ status: "pending" }), store.listVendors({ status: "approved" }), store.listAllRequests(), store.listPayments()]);
  const paid = pays.filter((p) => p.status === "paid");
  $("#stats").innerHTML = [
    ["승인 대기 업체", pend.length + "곳"], ["활동 업체", appr.length + "곳"],
    ["견적 요청", reqs.length + "건"], ["누적 수수료 수익", won(paid.reduce((s, p) => s + p.fee, 0))],
  ].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
}

async function vendorsTab() {
  const all = [...await store.listVendors({ status: "pending" }), ...await store.listVendors({ status: "approved" }), ...await store.listVendors({ status: "rejected" })];
  const tone = { approved: "ok", pending: "warn", rejected: "bad" };
  $("#view").innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>업체명</th><th>대표</th><th>사업자번호</th><th>분야</th><th>지역</th><th>허가</th><th>상태</th><th>관리</th></tr></thead><tbody>
  ${all.map((v) => `<tr>
    <td><b>${esc(v.company)}</b><br><small class="muted">${esc(v.phone)} · ${esc(v.email)}</small></td><td>${esc(v.ceo)}</td><td>${esc(v.biz_no)}</td>
    <td style="max-width:200px">${esc(v.categories.join(", "))}</td><td style="max-width:160px">${esc(regionLabel(v.regions))}</td><td>${esc(v.license_info || "-")}</td>
    <td>${badge(VENDOR_STATUS[v.status], tone[v.status])}</td>
    <td class="flex" style="flex-wrap:nowrap">${v.status !== "approved" ? `<button class="p-btn p-btn-sm" data-s="approved" data-id="${v.id}">승인</button>` : ""}${v.status !== "rejected" ? `<button class="p-btn p-btn-bad p-btn-sm" data-s="rejected" data-id="${v.id}">${v.status === "approved" ? "정지" : "반려"}</button>` : ""}</td>
  </tr>`).join("") || `<tr><td colspan="8" class="empty">등록된 업체가 없습니다.</td></tr>`}</tbody></table></div>`;
  $$("[data-s]").forEach((b) => (b.onclick = async () => { await store.setVendorStatus(b.dataset.id, b.dataset.s); toast("변경되었습니다."); vendorsTab(); stats(); }));
}

async function requestsTab() {
  const rs = await store.listAllRequests();
  $("#view").innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>제목</th><th>고객</th><th>분야/지역</th><th>예산</th><th>견적 수</th><th>상태</th><th>등록일</th><th></th></tr></thead><tbody>
  ${(await Promise.all(rs.map(async (r) => `<tr><td><b>${esc(r.title)}</b></td><td>${esc(r.customer_name)}</td><td>${esc(r.category)} · ${esc(r.region)}</td><td>${r.budget ? won(r.budget) : "협의"}</td><td>${(await store.listQuotesForRequest(r.id)).length}</td><td>${badge(REQUEST_STATUS[r.status])}</td><td>${date(r.created_at)}</td>
    <td>${!["canceled", "completed"].includes(r.status) ? `<button class="p-btn p-btn-line p-btn-sm" data-cancel="${r.id}">취소처리</button>` : ""}</td></tr>`))).join("") || `<tr><td colspan="8" class="empty">요청이 없습니다.</td></tr>`}</tbody></table></div>`;
  $$("[data-cancel]").forEach((b) => (b.onclick = async () => { if (confirm("이 요청을 취소 처리할까요?")) { await store.updateRequestStatus(b.dataset.cancel, "canceled"); requestsTab(); } }));
}

async function paymentsTab() {
  const ps = await store.listPayments();
  const pLabel = { paid: "결제완료", ready: "결제대기", failed: "실패", refunded: "환불" };
  const paid = ps.filter((p) => p.status === "paid");
  $("#view").innerHTML = `
  <div class="grid g3 mb">
    <div class="stat"><b>${won(paid.reduce((s, p) => s + p.amount, 0))}</b><span>총 거래액</span></div>
    <div class="stat"><b>${won(paid.reduce((s, p) => s + p.fee, 0))}</b><span>플랫폼 수수료</span></div>
    <div class="stat"><b>${won(paid.reduce((s, p) => s + p.amount - p.fee, 0))}</b><span>업체 정산 대상액</span></div>
  </div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>주문번호</th><th>내용</th><th>결제액</th><th>수수료</th><th>정산액</th><th>상태</th><th>결제일시</th></tr></thead><tbody>
  ${ps.map((p) => `<tr><td>${esc(p.order_id)}</td><td>${esc(p.order_name || "")}</td><td>${won(p.amount)}</td><td>${won(p.fee)}</td><td>${won(p.amount - p.fee)}</td><td>${badge(pLabel[p.status] || p.status, p.status === "paid" ? "ok" : "warn")}</td><td>${datetime(p.paid_at || p.created_at)}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">결제 내역이 없습니다.</td></tr>`}
  </tbody></table></div>`;
}

async function settingsTab() {
  const s = await store.getSettings();
  $("#view").innerHTML = `<form class="card" id="sf" style="max-width:480px">
    <h2>중개 수수료</h2>
    <div class="field"><label>수수료율 (%)</label><input type="number" name="rate" min="0" max="50" step="0.5" value="${(s.fee_rate * 100).toFixed(1)}"><small>새로 생성되는 결제부터 적용됩니다.</small></div>
    <button class="p-btn">저장</button></form>`;
  $("#sf").onsubmit = async (e) => { e.preventDefault(); await store.setFeeRate(Number(new FormData(e.target).get("rate")) / 100); toast("저장되었습니다."); };
}

const tabs = { vendors: vendorsTab, requests: requestsTab, payments: paymentsTab, settings: settingsTab };
$$("#tabs button").forEach((b) => (b.onclick = () => { $$("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); tabs[b.dataset.t](); }));
stats(); vendorsTab();
</script>
</body>
</html>
