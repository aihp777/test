<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적 요청 | 와이드가드 매칭</title>
<link rel="icon" href="/images/logo-dark.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/platform.css">
</head>
<body>
<main>
  <div class="p-container" style="max-width:760px">
    <div class="page-head"><h1>견적 요청</h1><p id="sub">요청 내용을 입력하면 조건에 맞는 업체들이 견적을 보내드립니다.</p></div>
    <form class="card" id="form">
      <div id="target" class="mb" hidden></div>
      <div class="row2">
        <div class="field"><label>서비스 분야<em>*</em></label><select name="category" id="cat" required></select></div>
        <div class="field"><label>지역<em>*</em></label><select name="region" id="reg" required></select><small>여러 지역에 걸친 업무는 "전국"을 선택하고 상세 내용에 지역을 적어주세요.</small></div>
      </div>
      <div class="field"><label>제목<em>*</em></label><input name="title" required maxlength="80" placeholder="예) 아파트 단지 야간 시설경비 2명"></div>
      <div class="row2">
        <div class="field"><label>희망 시작일<em>*</em></label><input type="date" name="service_date" required id="dt"></div>
        <div class="field"><label>예산 (원)</label><input type="number" name="budget" min="0" step="10000" placeholder="협의 가능하면 비워두세요"></div>
      </div>
      <div class="field"><label>상세 내용<em>*</em></label><textarea name="details" required placeholder="장소, 기간, 필요 인원, 근무 시간, 특이사항 등을 적어주세요."></textarea></div>
      <button class="p-btn" style="width:100%">견적 요청하기</button>
      <p class="muted mt" style="font-size:13px">요청 후 마이페이지에서 받은 견적을 비교하고 업체와 상담할 수 있습니다.</p>
    </form>
  </div>
</main>
<script type="module">
import { renderHeader, requireLogin, $, esc, options, qs, toast, store, CATEGORIES, REGIONS } from "/assets/js/ui.js";
import { NATIONWIDE } from "/assets/js/config.js";
await renderHeader();
await requireLogin();
const regionOptions = (list, sel) => `<option value="">선택</option>` +
  (list.includes(NATIONWIDE) || list === REGIONS ? `<option value="${NATIONWIDE}" ${sel === NATIONWIDE ? "selected" : ""}>전국 (지역 무관 · 여러 지역)</option>` : "") +
  options((list.includes(NATIONWIDE) ? REGIONS : list).filter((r) => r !== NATIONWIDE), sel);
$("#cat").innerHTML = options(CATEGORIES, qs("category") || "", "선택");
$("#reg").innerHTML = regionOptions(REGIONS, qs("region") || "");
$("#dt").min = new Date().toISOString().slice(0, 10);
const vid = qs("vendor");
let vendor = null;
if (vid) {
  vendor = await store.getVendor(vid);
  if (vendor) {
    $("#target").hidden = false;
    $("#target").innerHTML = `<span class="badge navy">지정 업체 요청</span> <b>${esc(vendor.company)}</b> <span class="muted">에게만 요청이 전달됩니다.</span>`;
    $("#cat").innerHTML = options(vendor.categories, qs("category") || "", "선택");
    $("#reg").innerHTML = regionOptions(vendor.regions, qs("region") || "");
  }
}
$("#form").onsubmit = async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  f.budget = f.budget ? Number(f.budget) : null;
  f.target_vendor_id = vendor ? vendor.id : null;
  try {
    const r = await store.createRequest(f);
    location.href = "/platform/dashboard?request=" + r.id + "&new=1";
  } catch (err) { toast(err.message, "bad"); }
};
</script>
</body>
</html>
